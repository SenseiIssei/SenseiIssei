name: Night sky

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["nightsky/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional read-only token; with it the language card also counts private repos.
      PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nightsky
      - run: cargo build --release --manifest-path nightsky/Cargo.toml
      - run: nightsky/target/release/nightsky skyline cards
      - if: env.PROFILE_TOKEN != ''
        run: nightsky/target/release/nightsky langs
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || { git commit -m "Redraw the night sky" && git push; }
