<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0a1f"/>
      <stop offset="0.55" stop-color="#241f52"/>
      <stop offset="1" stop-color="#5a1f45"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;0.12 0;0 0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e94560" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff8fa3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e94560" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e94560" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e94560" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-width="0.6"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="260" rx="14"/></clipPath>
    <style>
      .name { font: 700 78px 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #fff; letter-spacing: 4px; opacity: 0; animation: rise 1.2s ease-out 0.2s forwards; }
      .sub { font: 500 22px 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; fill: #ffb3c1; }
      .line { stroke: #e94560; stroke-width: 3; stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 1s ease-out 0.9s forwards; }
      .type { clip-path: inset(0 100% 0 0); animation: type 2.4s steps(44, end) 1.4s forwards; }
      .cursor { fill: #e94560; animation: blink 1s step-end infinite; }
      .dot { fill: #fff; animation: twinkle 4s ease-in-out infinite; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes type { to { clip-path: inset(0 0 0 0); } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes twinkle { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.8; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)" opacity="0.06"/>

    <!-- slow glow drifting behind the right side -->
    <circle cx="950" cy="130" r="220" fill="url(#glow)">
      <animate attributeName="cx" values="950;1010;950" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="r" values="200;240;200" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- calibration crosshairs -->
    <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2" fill="none">
      <g transform="translate(1040 70)"><circle r="14"/><path d="M-22 0H22M0 -22V22"/></g>
      <g transform="translate(880 200)"><circle r="9"/><path d="M-15 0H15M0 -15V15"/></g>
      <g transform="translate(1130 190)"><circle r="6"/><path d="M-11 0H11M0 -11V11"/></g>
    </g>

    <!-- sweeping scan beam -->
    <rect y="0" width="260" height="260" fill="url(#beam)">
      <animate attributeName="x" values="-300;1200" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect y="0" width="2" height="260" fill="#ff8fa3" opacity="0.6">
      <animate attributeName="x" values="-170;1330" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- particles -->
    <circle class="dot" cx="720" cy="40" r="1.6" style="animation-delay:0s"/>
    <circle class="dot" cx="810" cy="95" r="1.2" style="animation-delay:1.1s"/>
    <circle class="dot" cx="960" cy="225" r="1.8" style="animation-delay:2.3s"/>
    <circle class="dot" cx="1090" cy="120" r="1.3" style="animation-delay:0.6s"/>
    <circle class="dot" cx="640" cy="215" r="1.1" style="animation-delay:3s"/>
    <circle class="dot" cx="1160" cy="40" r="1.5" style="animation-delay:1.8s"/>
    <circle class="dot" cx="560" cy="60" r="1.2" style="animation-delay:2.7s"/>

    <text class="name" x="70" y="132">Jakob</text>
    <path class="line" d="M72 152H332"/>
    <g class="type">
      <text class="sub" x="72" y="195" textLength="560" lengthAdjust="spacingAndGlyphs">C++ machine vision by day, Rust after hours</text>
    </g>
    <rect class="cursor" x="640" y="177" width="11" height="24" opacity="0">
      <set attributeName="opacity" to="1" begin="3.8s"/>
    </rect>
  </g>
</svg>
